# timecode-midi: small periods on the snd-aloop sink that feeds the V7.
#
# Installed by setup.sh into ~/.config/wireplumber/wireplumber.conf.d/.
#
# PipeWire writes to the loopback one period at a time, so this period is a
# floor under how fine-grained the V7 sink's input can ever be, and with it
# how small tools/v7audio.py's FIFO — i.e. the deck's audio latency — can
# run. 256 frames is 5.8 ms at 44100. (The other, bigger period that had to
# shrink for low latency is v7audio.py's own capture period — see the
# hw_params comment there; aloop advances hw_ptr per period on each side.)
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-snd_aloop.0.analog-surround-40" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 256
        api.alsa.headroom = 0
      }
    }
  }
]
