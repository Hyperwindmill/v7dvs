<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Signal flow">
<style>
text { font-family: "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #0f172a; }
.dev { font-size: 15px; font-weight: 700; }
.part { font-size: 13px; font-weight: 600; }
.lbl { font-size: 12.5px; font-weight: 700; }
.sub { font-size: 11.5px; fill: #64748b; }
.tiny { font-size: 9.5px; font-weight: 600; }
.pill { font-size: 10px; font-weight: 700; fill: #fff; }
</style>
<rect width="100%" height="100%" fill="#fff"/>
<defs>
<marker id="a-tc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#c2410c"/>
</marker>
<marker id="a-usb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#475569"/>
</marker>
<marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#1d4ed8"/>
</marker>
</defs>
<rect x="40" y="40" width="150" height="80" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/>
<text x="115.0" y="77.0" text-anchor="middle" class="dev">V7</text>
<text x="115.0" y="94.0" text-anchor="middle" class="sub">platter, controls</text>
<rect x="340" y="40" width="170" height="80" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/>
<text x="425.0" y="77.0" text-anchor="middle" class="dev">Mac</text>
<text x="425.0" y="94.0" text-anchor="middle" class="sub">v7dvs + DJ app</text>
<line x1="192" y1="80" x2="338" y2="80" stroke="#475569" stroke-width="2.5" marker-start="url(#a-usb)" marker-end="url(#a-usb)"/>
<text x="265" y="66" text-anchor="middle" class="lbl" style="fill:#475569">USB</text>
<text x="265" y="98" text-anchor="middle" class="sub">platter, buttons, LEDs</text>
<rect x="40" y="225" width="620" height="125" rx="10" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.4"/>
<text x="56" y="247" class="dev">Mixer</text>
<rect x="55" y="268" width="120" height="56" rx="8" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="115.0" y="293.0" text-anchor="middle" class="part">LINE in</text>
<text x="115.0" y="310.0" text-anchor="middle" class="sub">CH 1 / CH 2</text>
<rect x="360" y="268" width="130" height="56" rx="8" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="425.0" y="293.0" text-anchor="middle" class="part">Sound card</text>
<text x="425.0" y="310.0" text-anchor="middle" class="sub">built in</text>
<rect x="540" y="268" width="100" height="56" rx="8" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="590.0" y="301.0" text-anchor="middle" class="part">Master</text>
<line x1="115" y1="122" x2="115" y2="266" stroke="#c2410c" stroke-width="3" marker-end="url(#a-tc)"/>
<text x="128" y="176" class="lbl" style="fill:#c2410c">RCA: timecode</text>
<text x="128" y="193" class="sub">line level, never heard</text>
<line x1="177" y1="296" x2="358" y2="296" stroke="#c2410c" stroke-width="3" marker-end="url(#a-tc)"/>
<text x="267" y="287" text-anchor="middle" class="sub">timecode</text>
<line x1="410" y1="266" x2="410" y2="122" stroke="#c2410c" stroke-width="3" marker-end="url(#a-tc)"/>
<line x1="440" y1="122" x2="440" y2="266" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a-mu)"/>
<text x="453" y="176" class="lbl" style="fill:#475569">USB to the mixer</text>
<text x="453" y="193" class="sub">timecode up, music down</text>
<line x1="492" y1="296" x2="538" y2="296" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a-mu)"/>
<line x1="642" y1="296" x2="698" y2="296" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a-mu)"/>
<rect x="700" y="268" width="86" height="56" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/>
<text x="743.0" y="301.0" text-anchor="middle" class="part">Speakers</text>
<line x1="40" y1="385" x2="66" y2="385" stroke="#c2410c" stroke-width="3"/>
<text x="73" y="389" class="sub">timecode</text>
<line x1="142.8" y1="385" x2="168.8" y2="385" stroke="#1d4ed8" stroke-width="3"/>
<text x="175.8" y="389" class="sub">music</text>
<line x1="225.8" y1="385" x2="251.8" y2="385" stroke="#475569" stroke-width="3"/>
<text x="258.8" y="389" class="sub">USB control</text>
</svg>
